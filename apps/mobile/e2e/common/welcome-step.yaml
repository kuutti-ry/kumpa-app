# A new account's first onboarding screen after the bank login, up to a
# friend's invitation code, which a new account is offered next (#107,
# ADR-044; #681, ADR-010 §22). The terms come before the bank on a phone that
# has not recorded them, and bank-login.yaml accepts them there: they land
# right after the exchange and onboarding starts at the invitation code. On a
# phone that has, the account still lacks them, and onboarding's welcome step,
# the same "Accept terms of use" with no step number, asks them: accepted here.
# Which of the two comes depends on what ran on the phone before, so the step
# is waited for with the code's, asked as `notVisible`, in half a second, and
# tapped behind a flag the condition clears (README). Runs after sign-in.yaml.
appId: fi.kumpa
---
- extendedWaitUntil:
    visible: "Accept terms of use|Hyväksy käyttöehdot|Godkänn användarvillkoren|Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?"
    timeout: 15000
- evalScript: ${output.welcomeStep = true}
- runFlow:
    when:
      notVisible: "Accept terms of use|Hyväksy käyttöehdot|Godkänn användarvillkoren"
    commands:
      - evalScript: ${output.welcomeStep = false}
- runFlow:
    when:
      true: ${output.welcomeStep}
    commands:
      - assertNotVisible: "Step \\d+ of \\d+|Vaihe \\d+ / \\d+|Steg \\d+ av \\d+"
      # The line about keeping the answers is the newcomer's before the bank alone.
      - assertNotVisible: "To keep your answers.*|Tallentaaksesi vastauksesi.*|För att spara dina svar.*"
      - scrollUntilVisible:
          element: "Agree and continue|Hyväksy ja jatka|Godkänn och fortsätt"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Agree and continue|Hyväksy ja jatka|Godkänn och fortsätt"
- extendedWaitUntil:
    visible: "Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?"
    timeout: 15000

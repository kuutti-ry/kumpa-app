# Product vocabulary for `pnpm i18n:translate` and for human translators (#13, TD-17).
# A term with a fi or sv value is fixed: translations must use exactly that word.
# A term without one is explained by its definition only, and the translation
# is left to the translator until a native reviewer fixes the word here.
# The Finnish and Swedish product terms are a naming decision, not a lookup:
# they are empty until the maintainers and a native speaker choose them.

Kumpa:
  definition: The name of the app (the maintainer, 16/11/2026). A proper noun; never translated and never inflected in a message. In Finnish it stands in the nominative, or as the first part of a compound whose last part takes the case (Kumpa-sovellus, Kumpa-sovelluksessa, Kumpa-palvelin); otherwise turn the sentence or leave the name out. A genitive that leaves the name whole is fine, as Kumpa's in English and Kumpas in Swedish. The messages' descriptions, like the code, still call the project Kuutti.
  fi: Kumpa
  sv: Kumpa

Kuutti ry:
  definition: The registered association that provides Kumpa and controls its data, to whom a consent is given and who signs a message. A registered name; never translated, and never shortened to Kuutti. In Finnish the case ending follows a colon (Kuutti ry:n, Kuutti ry:lle).
  fi: Kuutti ry
  sv: Kuutti ry

home:
  definition: The one place a member says they live, given as a postal code and asked of everybody. The postal code is what they type; others see a name, a town or their area, never the digits. Not a word for the app's home screen, and not a word for a town or an area in general.

distance bands:
  definition: How far another person lives, always one of four words, nearest first - Nearby, Close, Around, Far. They stand alone on a card and on the buttons of a filter, and never mean a number of kilometres, which is a setting behind them. Far says only that; it must not read as a judgement of the person.

queue:
  definition: The profiles a member meets, read one card at a time, as far as they like, and each day's record of it. It has no fixed size and it ends; there is no feed. The word should sound finite and calm.

like:
  definition: Telling the app you would like to talk to someone. A noun and a verb in English; never a score, never a count shown to others.

pass:
  definition: Deciding not to talk to someone in this queue. Neutral and kind; it must not read as rejection or as a judgement of the other person.

star:
  definition: A private mark a member puts on somebody's card, to come back to them later without a like or a pass. Only the member sees it; a bookmark, never a rating or a super like. Starred means having one.

standing:
  definition: Whether a verified person is in good standing, suspended or banned. Used in moderation and account notices; formal, factual register.

block:
  definition: One person's choice that they and another person are never shown to each other again, in either direction, even if either deletes their account and comes back (#84, ADR-030). Final; the other person is not told. A noun and a verb; a private choice, never an accusation or a punishment, so not a word for banning or rejecting.

report:
  definition: Telling the moderators that something about another person is wrong, with a reason from a closed list (#84, ADR-030). Sending one also blocks that person. The reported person is never told who sent it. A noun and a verb; the same word wherever a person reports, from a card now and from a conversation later (#101), and the word staff use for it in the panel.

moderator:
  definition: A person of the association who reads reports and checks photos, and may warn, suspend or ban (ADR-024). A person, never "the system" or an algorithm; plain register, not a legal or police word.

contact:
  definition: A way to reach a person outside the app that they keep in Settings, under Ways to reach you (#103) - a phone number, WhatsApp, Telegram, Instagram or Snapchat. Nobody sees one until its owner shares it in one conversation, and it disappears there when they stop sharing it, change or remove it, or the conversation ends. Not an address-book entry and not a social "connection"; sharing asks nothing back. The brand names stay as they are in every language.

end a conversation:
  definition: Either person's choice to close a conversation for both of them (#351, the unmatch of #101). Nobody can write in it again, nobody is blocked, and either can still report it for a while. Neither person is told who ended it or how. Plain and calm; not a word for rejecting, breaking up or blocking, and not "unmatch".
